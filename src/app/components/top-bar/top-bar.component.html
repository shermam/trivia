<header
  class="sticky top-0 z-50 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-900/8 dark:border-white/10"
>
  <!--
    Two layouts, one DOM. Below `sm` this is a three-column grid — hamburger,
    centred brand, account — because the bar had grown to five items and the
    Review link (visible only to reviewers) made it worse for exactly the
    people who need the bar most. From `sm` up it is the original flex row.

    A grid rather than `justify-between` on mobile, and specifically
    `minmax(0,1fr) auto minmax(0,1fr)`: the brand sits in a centre track with
    two side tracks forced to *equal* width, which is the only arrangement that
    puts it at the true centre of the bar whatever the side items weigh. The
    first attempt was `auto 1fr auto` with the brand centred inside the middle
    track, and measuring it in a browser showed the brand 21px left of centre —
    that centres it between the two side items, not in the bar, and the account
    chip is much wider than the hamburger. Plain `1fr` is not enough either: it
    is `minmax(auto,1fr)`, so a track grows past its share to fit its content
    and the symmetry quietly breaks the moment a display name gets long. The
    `minmax(0,…)` is what makes the account chip truncate instead.
  -->
  <div
    class="max-w-5xl mx-auto px-4 sm:px-6 h-16 grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-3 sm:flex sm:justify-between sm:gap-0"
  >
    <button
      #navTrigger
      type="button"
      data-cy="nav-menu-trigger"
      (click)="toggleNav()"
      [attr.aria-expanded]="isNavOpen()"
      aria-haspopup="dialog"
      [attr.aria-controls]="isNavOpen() ? navPanelId : null"
      aria-label="Site menu"
      class="flex h-9 w-9 shrink-0 items-center justify-center justify-self-start rounded-full border border-slate-900/10 dark:border-white/10 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors sm:hidden"
    >
      <app-icon name="menu" [size]="18" />
    </button>

    <a routerLink="/" class="flex items-center gap-2">
      <app-logo [size]="32" class="text-emerald-600" />
      <span class="font-extrabold text-emerald-600 dark:text-emerald-400 text-lg tracking-tight"
        >Trivimind</span
      >
    </a>

    <div class="flex min-w-0 items-center gap-6 justify-self-end">
      <!--
        Hidden rather than moved: these three are the same elements the drawer
        offers below `sm`, and duplicating them into two always-rendered copies
        would mean two sets of ids, two things to keep in step, and — for the
        theme toggle — two controls claiming the same `aria-label`.
      -->
      @if (reviewerService.isReviewer()) {
        <a
          routerLink="/review"
          data-cy="review-queue-link"
          class="hidden sm:inline text-sm font-medium text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-50 transition-colors"
        >
          Review
        </a>
      }

      <a
        routerLink="/pricing"
        class="hidden sm:inline text-sm font-medium text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-50 transition-colors"
      >
        Pricing
      </a>

      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="
          themeService.currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
        "
        class="hidden sm:flex h-9 w-9 items-center justify-center rounded-full border border-slate-900/10 dark:border-white/10 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors"
      >
        <app-icon [name]="themeService.currentTheme() === 'dark' ? 'sun' : 'moon'" [size]="16" />
      </button>

      <div class="relative">
        <!--
          No `gap-2` on the button, deliberately. The gap belongs to the label,
          and the label collapses — see the grid region below. A gap declared
          here would survive the collapse and leave the "avatar only" chip 8px
          wider than the avatar, which is precisely the number the whole
          animation is built on.
        -->
        <button
          #menuTrigger
          type="button"
          data-cy="auth-menu-trigger"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-haspopup="dialog"
          [attr.aria-controls]="isMenuOpen() ? panelId : null"
          [attr.aria-busy]="!authService.authReady() ? 'true' : null"
          class="flex min-w-0 items-center rounded-full pl-1.5 pr-1.5 sm:pr-3 py-1.5 border border-slate-900/10 dark:border-white/10 transition-colors"
          [ngClass]="isMenuOpen() ? 'bg-slate-50 dark:bg-slate-800' : 'bg-white dark:bg-slate-900'"
          [class.shadow-[0_0_0_3px_rgba(5,150,105,0.12)]]="isMenuOpen()"
        >
          @if (!authService.authReady()) {
            <!--
              A skeleton shaped like the chip it becomes, not the words
              "Loading…". The text version was 34px tall against 42px for every
              resolved state, so the chip changed height the moment auth
              settled.

              The label is `sr-only` rather than absent: the button still has to
              announce something, and "Loading…" is the honest thing for it to
              say. `aria-busy` marks it for assistive tech that acts on it.
            -->
            <span
              aria-hidden="true"
              class="h-7 w-7 shrink-0 rounded-full bg-slate-200 motion-safe:animate-pulse dark:bg-slate-700"
            ></span>
            <span class="sr-only">Loading&hellip;</span>
          } @else if (!showsRealAccount()) {
            <span
              class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 text-sm"
              >&#128100;</span
            >
          } @else {
            <span
              class="relative flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-700 text-white text-xs font-bold"
            >
              {{ initials() }}
              @if (needsVerification()) {
                <span
                  class="absolute -top-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-amber-400 border-2 border-white dark:border-slate-900"
                ></span>
              }
            </span>
          }

          <!--
            The label region, and the reason it lives *outside* the branches
            above: it is the element whose width animates, so it has to be the
            same element before and after auth resolves. A transition animates a
            change to a property on a surviving element; swap the element and
            there is nothing to transition from.

            **How a content-driven width is animated at all.** It isn't —
            `grid-template-columns` is, and the width follows. The track goes
            `0fr` → `1fr`; `1fr` in an auto-width grid resolves to the item's
            max-content size, so the animation lands exactly on the natural
            width with no number hard-coded anywhere. `overflow-hidden` on the
            item is doing two jobs: it clips the label while the track is
            narrower than the text, and — because a grid item whose overflow is
            not `visible` has an automatic minimum size of zero — it is what
            lets the track reach 0 at all. Without it the track floors at the
            label's min-content width and nothing collapses.

            **Why not the `max-width` trick**, which is the usual answer here: a
            `max-width` transition has to animate to a *cap*, and the visible
            motion stops the instant the cap passes the content width. Measured
            in Chromium with a deliberately tight 5rem cap against a 97px chip,
            the movement was over at 420ms of a 600ms transition and the last
            30% was dead air. The grid version was linear across the whole
            duration. `interpolate-size: allow-keywords` also works and is a
            wash on quality, but it is Chromium-only.

            **This replaces a JavaScript animation, which is the point.** A
            FLIP measured across Angular's render boundary is correct in
            principle and ran only sometimes in practice — it depends on the
            chip having already painted once before auth resolves, and on a
            fast connection or a throttled phone the two land in the same frame
            and there is nothing to measure. The browser owns the interpolation
            here; Angular only swaps a class.
          -->
          <span
            class="grid motion-safe:transition-[grid-template-columns] motion-safe:duration-300 ease-out"
            [ngClass]="showsLabel() ? 'grid-cols-[1fr]' : 'grid-cols-[0fr] sm:grid-cols-[1fr]'"
          >
            <span class="overflow-hidden">
              @if (!authService.authReady()) {
                <!--
                  A skeleton bar rather than an `invisible` span, so the gap
                  does not read as an empty chip. It reserves exactly the width
                  "Sign in" will occupy — the text is kept and sized normally,
                  and `text-transparent` hides the glyphs while the box keeps
                  their metrics. Deriving the width from the real string is what
                  makes the placeholder and the resolved chip the same size on
                  desktop; a hand-picked `w-16` would be a number to keep in
                  step by hand.

                  Below `sm` the track holding it is `0fr`, so on a phone the
                  bar is clipped away entirely and the pulsing avatar is the
                  whole skeleton. That is the trade the animation costs: the
                  chip cannot both show a full-width placeholder and grow into
                  one.
                -->
                <span
                  aria-hidden="true"
                  class="ml-2 block rounded bg-slate-200 text-sm font-medium whitespace-nowrap text-transparent motion-safe:animate-pulse dark:bg-slate-700"
                  >Sign in</span
                >
              } @else if (!showsRealAccount()) {
                <!--
                  `whitespace-nowrap` is load-bearing. Below `sm` the chip sits
                  in a `minmax(0,1fr)` grid track narrower than its natural
                  width, so without this "Sign in" wraps to two lines and the
                  chip renders 54px tall inside a 64px bar. It shipped that way
                  and nothing caught it, because the mobile-nav spec measured
                  width, overlap and centring but never height.
                -->
                <span
                  class="ml-2 block whitespace-nowrap text-sm font-medium text-slate-700 dark:text-slate-300"
                  >Sign in</span
                >
              } @else {
                <!--
                  `sr-only`, not `hidden`. Below `sm` the chip shows the avatar
                  alone — the name and the PRO badge were the widest thing in
                  the bar and pushed it into the brand — but removing them from
                  the DOM would leave the button's accessible name as a single
                  letter. `sr-only` takes them out of the layout while a screen
                  reader still reads "S Sherman PRO".

                  It is not sufficient on its own, though, which is why
                  `showsLabel()` also holds the track at `0fr` here. An
                  `sr-only` child is absolutely positioned and contributes
                  nothing to the track, but the `ml-2` wrapper around it is
                  still in flow — measured in Chromium, that left the signed-in
                  chip 50px against the 42px of the avatar-only state it is
                  supposed to match exactly.
                -->
                <span class="ml-2 block">
                  <span class="flex min-w-0 items-center gap-1.5 sr-only sm:not-sr-only sm:flex">
                    <span
                      class="text-sm font-medium text-slate-900 dark:text-slate-50 max-w-[5.5rem] sm:max-w-[10rem] truncate"
                    >
                      {{ authService.user()?.displayName || authService.user()?.email }}
                    </span>
                    @if (subscriptionService.isProUser()) {
                      <span
                        class="shrink-0 rounded-full bg-emerald-100 dark:bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 text-[10px] font-bold px-1.5 py-0.5 leading-none tracking-wide"
                        >PRO</span
                      >
                    }
                  </span>
                </span>
              }
            </span>
          </span>

          <!--
            Hidden below `sm`, which is what buys "Sign in" the room to stay on
            one line inside its grid track. It is decorative — the svg is
            `aria-hidden` and the trigger already carries `aria-expanded` — so
            dropping it on a phone costs an affordance, not information. Its
            own `sm:ml-2` rather than a gap on the button, for the reason given
            at the top of this block.
          -->
          <app-icon
            name="chevron-down"
            [size]="14"
            class="hidden sm:block sm:ml-2 text-slate-500 dark:text-slate-400 transition-transform"
            [class.rotate-180]="isMenuOpen()"
          />
        </button>

        @if (isMenuOpen()) {
          <!--
            `dialog`, not `menu`. An ARIA menu promises `menuitem` children and
            arrow-key navigation; this panel holds a sign-in form, text inputs
            and links, which a screen reader would then announce as menu items.
            A non-modal dialog describes what it actually is — hence the
            matching `aria-haspopup="dialog"` on the trigger, and no
            `aria-modal`, since the page behind stays usable.
            `tabindex="-1"` exists so focus can be moved here on open (G2)
            without adding the panel to the tab order.
          -->
          <div
            #menuPanel
            [id]="panelId"
            role="dialog"
            aria-label="Account menu"
            tabindex="-1"
            class="absolute right-0 mt-2 focus:outline-none"
          >
            <app-auth-menu (closeRequested)="closeMenu()" />
          </div>
        }
      </div>
    </div>
  </div>
</header>

<!--
  Outside `<header>`, and that is load-bearing rather than tidiness. The header
  carries `backdrop-blur-md`, and a `backdrop-filter` ancestor becomes the
  containing block for `position: fixed` descendants — so a drawer rendered
  inside it would be clipped to the header's 4rem box instead of covering the
  viewport, silently and only at runtime.

  `dialog` without `aria-modal`, matching the auth menu above: nothing here
  traps focus or inerts the page, so claiming a modal would be a promise the
  markup does not keep. Escape and the backdrop both close it, and focus goes
  in on open and back to the hamburger on close (`CLAUDE.md` §4.5).
-->
@if (isNavOpen()) {
  <!--
    A flex row — panel, then backdrop filling the rest — rather than a
    full-bleed backdrop with the panel laid over it.
    
    The panel is opaque, so the dim behind it was never visible and the two
    render identically. What changes is that the backdrop now occupies exactly
    the region a tap can reach: an `inset-0` backdrop has its own centre buried
    under the panel, which Cypress reads as "covered by another element" and
    refuses to click. Reaching for `{force: true}` there would have suppressed
    the check rather than the overlap, on the one interaction whose whole point
    is being clickable.
  -->
  <div class="fixed inset-0 z-50 flex sm:hidden">
    <div
      #navPanel
      [id]="navPanelId"
      role="dialog"
      aria-label="Site menu"
      tabindex="-1"
      data-cy="nav-menu-panel"
      class="flex w-72 max-w-[80%] flex-col gap-1 bg-white dark:bg-slate-900 p-4 shadow-card-lg focus:outline-none"
    >
      <div class="mb-2 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-400">Menu</span>
        <button
          type="button"
          (click)="closeNav()"
          aria-label="Close menu"
          data-cy="nav-menu-close"
          class="flex h-8 w-8 items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors"
        >
          <app-icon name="x" [size]="16" />
        </button>
      </div>

      @if (reviewerService.isReviewer()) {
        <a
          routerLink="/review"
          (click)="closeNav()"
          data-cy="nav-menu-review-link"
          class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800 transition-colors"
        >
          Review
        </a>
      }

      <a
        routerLink="/pricing"
        (click)="closeNav()"
        data-cy="nav-menu-pricing-link"
        class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800 transition-colors"
      >
        Pricing
      </a>

      <!-- Deliberately does *not* close the drawer: the whole page changes
           colour, and shutting the panel would hide the control you would use
           to change your mind. -->
      <button
        type="button"
        (click)="toggleTheme()"
        data-cy="nav-menu-theme-toggle"
        [attr.aria-label]="
          themeService.currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
        "
        class="mt-1 flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800 transition-colors"
      >
        <app-icon [name]="themeService.currentTheme() === 'dark' ? 'sun' : 'moon'" [size]="16" />
        {{ themeService.currentTheme() === 'dark' ? 'Light mode' : 'Dark mode' }}
      </button>
    </div>

    <!-- Decorative: the same dismissal is on the close button and on Escape,
         so a screen reader gains nothing from a third control. -->
    <div
      class="flex-1 bg-slate-900/40"
      aria-hidden="true"
      data-cy="nav-menu-backdrop"
      (click)="closeNav()"
    ></div>
  </div>
}
