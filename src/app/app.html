@if (!embedMode.isEmbedded()) {
  <!--
    First thing in the tab order, invisible until focused. Without it, reaching
    the game means tabbing past the whole top bar on every screen (G5). Gated
    with the top bar it exists to skip — in embed mode there is no nav, so the
    link would be a control that skips nothing.
  -->
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:z-[60] focus:top-3 focus:left-3 focus:rounded-xl focus:bg-white dark:focus:bg-slate-900 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-emerald-700 dark:focus:text-emerald-400 focus:shadow-card-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
  >
    Skip to main content
  </a>
  <app-top-bar />
}

<!--
  Permanently present and empty until there is something to say. A live region
  inserted into the DOM already carrying its message is routinely missed by
  screen readers — the same reason the quiz result region (G3) is rendered
  unconditionally.
-->
<p role="status" aria-live="polite" class="sr-only">{{ routeAnnouncer.message() }}</p>

<!--
  `tabindex="-1"` is what lets the skip link actually move focus here; without
  it the browser jumps the scroll position and leaves focus behind.

  `min-h-screen` reserves the viewport while the lazily-loaded route is still
  in flight, and it is load-bearing for the footer below rather than cosmetic.
  Every route's own root is already `min-h-screen`, so this changes nothing
  once a route has rendered — but until then `<main>` is zero-high, so the
  footer painted directly under the top bar and was then shoved a full
  viewport down when the route arrived. Measured: that single shift scored
  0.113 of a 0.178 CLS and took Lighthouse performance from 0.89 to 0.80,
  against a 0.85 threshold.
-->
<main id="main-content" tabindex="-1" class="min-h-screen focus:outline-none">
  <router-outlet />
</main>
@if (!embedMode.isEmbedded()) {
  <app-footer />
}
