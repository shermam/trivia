<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trivimind</title>
    <meta
      name="description"
      content="Test your knowledge with Trivimind: play trivia questions across categories and difficulties, then see how you rank on the leaderboard."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before Angular bootstraps so there's no flash of the wrong
      // theme — kept in sync with ThemeService (src/app/services/theme.service.ts),
      // which reads this same class/localStorage key back on startup.
      (function () {
        var stored = localStorage.getItem('trivia-theme');
        var isDark = stored
          ? stored === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
