<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trivimind</title>
    <meta
      name="description"
      content="Test your knowledge with Trivimind: play trivia questions across categories and difficulties, then see how you rank on the leaderboard."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Inter is self-hosted (public/fonts, @font-face in styles.css). Only the
         latin subset is preloaded: it is the one every page needs, and starting
         it here rather than waiting for the CSS to be parsed removes a step from
         the critical path. latin-ext is deliberately not preloaded — its
         unicode-range means the browser only fetches it if a glyph in that range
         is actually rendered, and preloading a file most visitors never use
         would cost more than it saves. `crossorigin` is required even
         same-origin: fonts are always fetched in CORS mode, and without it the
         preload is discarded and fetched a second time. -->
    <link
      rel="preload"
      href="fonts/inter-v20-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Deliberately an external file, and deliberately render-blocking: it has
         to run before first paint or the wrong theme flashes, and it cannot be
         inline because the CSP in firebase.json allows no inline script at all.
         A hash would have worked too, but silently: breaking it on purpose
         showed the browser refuses the script while the app still boots and
         still ends up styled correctly (ThemeService reapplies the class), so
         nothing — not the console, not Lighthouse, not e2e — goes red. Only a
         first-paint flash remains. An external file cannot drift.
         Served no-cache (see firebase.json) because public/ is copied without
         a content hash, the same reason ngsw-worker.js is excluded there. -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root>
      <!-- The only thing on the page when the bundle does not arrive.

           A stale service worker serves this cached index.html, then the
           hashed entry script it names is neither in the worker's cache nor on
           the origin any more, so nothing boots and the body is blank. There is
           no JavaScript available to detect that — the script that would have
           detected it is the one that failed — so the recovery notice is markup
           that is already here, revealed by a CSS delay rather than by code.

           Reloading is a real fix and not a platitude: the worker's own
           on-navigation update check installs the current version during the
           failed load, so the next navigation serves an index.html whose
           scripts exist. Measured at one blank load, recovered on the next.

           Angular replaces the contents of <app-root> on bootstrap, so on every
           normal load this is gone long before the reveal delay elapses. -->
      <div class="boot-fallback">
        <p class="boot-fallback__title">This is taking longer than it should.</p>
        <p>
          Trivimind could not finish loading.
          <a href="." class="boot-fallback__action">Reload the page</a> — that usually fixes it.
        </p>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
