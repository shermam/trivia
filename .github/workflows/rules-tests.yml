name: Firestore Rules Tests

# Runs the firestore.rules unit suite against the Firestore emulator on every
# PR targeting main, plus main itself as a safety net.
#
# Its own workflow rather than steps inside unit-tests.yml (§8's
# one-workflow-per-concern rule in INFRASTRUCTURE.md): this needs a JDK and an
# emulator binary that the fast Vitest job has no use for, and paying that
# setup cost on every unit-test run to save a workflow file would be the wrong
# trade. Much cheaper than e2e.yml though — Firestore only, no Auth, no
# Functions, no dev server, no browser.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # NOTE: this job id is the status-check context (`rules-tests`). It has to be
  # added to main's ruleset by a repo admin before it gates a merge — a
  # workflow cannot require itself. Don't add a `name:` here either: that would
  # replace the context and silently detach it from the ruleset.
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Run firestore.rules unit tests
        run: npm run rules:test
