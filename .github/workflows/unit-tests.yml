name: Unit Tests

# Runs the Vitest unit suite on every PR targeting main, plus main itself as
# a safety net — separate from the Cypress e2e workflow (e2e.yml) so a slow
# e2e run never blocks fast feedback on unit-level regressions, and separate
# from the static checks (lint.yml) for the same reason in reverse: a lint
# failure shouldn't stop us also learning whether the tests pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm test
