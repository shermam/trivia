# The name is now narrower than what this workflow does — it also typechecks
# — and is left alone deliberately. `lint` is a *required* check in main's
# ruleset, and a required context can be stored with the workflow name as a
# disambiguator, so renaming risks silently detaching the requirement and
# letting PRs merge unchecked. That is a real downside against a cosmetic
# gain. Same family of mistake as the job-name warning below.
name: Lint & Format

# Static checks — Prettier formatting, ESLint, and the Cypress typecheck — on
# every PR targeting main, plus main itself as a safety net.
#
# Its own workflow rather than extra steps inside unit-tests.yml, matching
# this repo's one-workflow-per-concern convention (see the same reasoning in
# unit-tests.yml's own header about staying separate from e2e.yml). Two
# concrete benefits over bundling: it runs *concurrently* with the unit
# suite instead of in front of it, so a lint failure and a test failure both
# surface on the same push rather than the first hiding the second; and the
# red check names the actual problem without anyone opening the log.
#
# All three checks live in one job on purpose — they're a single "does this
# code meet the bar" question, and splitting them would pay for another
# `npm ci` to tell us something a step name already makes obvious.
#
# The typecheck was added here rather than as a fourth workflow, which is a
# deliberate exception to working rule 6 in AUDIT_REMEDIATION.md §3, for a
# reason that only applies to an already-required check: `lint` is in main's
# ruleset today, so a step added here gates a merge immediately, while a new
# workflow reports without blocking until an admin adds it — the state
# `functions-tests` has been sitting in. Making a check real today beat
# making it tidy and inert.
#
# It covers `cypress/` alone because that is the only tree nothing else
# typechecks: `src/` goes through `ng build`/`ng test`, and `functions/`
# through the `tsc` that `functions:test` runs first. `cypress/tsconfig.json`
# was referenced by no script and no CI step until now, and was hiding a real
# error when it was finally run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # NOTE: this job id is the status-check context (`lint`). It has to be
  # added to main's ruleset by a repo admin before it actually gates a merge
  # — a workflow can't require itself. Don't add a `name:` here either: that
  # would replace the context and silently detach it from the ruleset.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheapest first: formatting is a pure text check, lint needs a
      # TypeScript program built from the whole app.
      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint + angular-eslint)
        run: npm run lint

      - name: Typecheck the Cypress suite
        run: npm run typecheck:cypress
