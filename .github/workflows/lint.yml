# The name is now narrower than what this workflow does — it also typechecks
# — and is left alone deliberately. `lint` is a *required* check in main's
# ruleset, and a required context can be stored with the workflow name as a
# disambiguator, so renaming risks silently detaching the requirement and
# letting PRs merge unchecked. That is a real downside against a cosmetic
# gain. Same family of mistake as the job-name warning below.
name: Lint & Format

# Static checks — Prettier formatting, ESLint, and the Cypress typecheck — on
# every PR targeting main, plus main itself as a safety net.
#
# Its own workflow rather than extra steps inside unit-tests.yml, matching
# this repo's one-workflow-per-concern convention (see the same reasoning in
# unit-tests.yml's own header about staying separate from e2e.yml). Two
# concrete benefits over bundling: it runs *concurrently* with the unit
# suite instead of in front of it, so a lint failure and a test failure both
# surface on the same push rather than the first hiding the second; and the
# red check names the actual problem without anyone opening the log.
#
# All three checks live in one job on purpose — they're a single "does this
# code meet the bar" question, and splitting them would pay for another
# `npm ci` to tell us something a step name already makes obvious.
#
# The typecheck was added here rather than as a fourth workflow, which is a
# deliberate exception to working rule 6 in AUDIT_REMEDIATION.md §3, for a
# reason that only applies to an already-required check: `lint` is in main's
# ruleset today, so a step added here gates a merge immediately, while a new
# workflow reports without blocking until an admin adds it — the state
# `functions-tests` has been sitting in. Making a check real today beat
# making it tidy and inert.
#
# It covers `cypress/` alone because that is the only tree nothing else
# typechecks: `src/` goes through `ng build`/`ng test`, and `functions/`
# through the `tsc` that `functions:test` runs first. `cypress/tsconfig.json`
# was referenced by no script and no CI step until now, and was hiding a real
# error when it was finally run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # NOTE: this job id is the status-check context (`lint`). It has to be
  # added to main's ruleset by a repo admin before it actually gates a merge
  # — a workflow can't require itself. Don't add a `name:` here either: that
  # would replace the context and silently detach it from the ruleset.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheapest first: formatting is a pure text check, lint needs a
      # TypeScript program built from the whole app.
      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint + angular-eslint)
        run: npm run lint

      - name: Typecheck the Cypress suite
        run: npm run typecheck:cypress

      # Measures the committed PNGs against the `purpose` the manifest
      # declares for them. Here for the same reason as the typecheck: nothing
      # else in the pipeline can catch it. Lighthouse dropped its PWA category
      # in v12, so there is no `maskable-icon` audit any more, and a wrong
      # `purpose` renders perfectly everywhere except an Android home screen.
      # Pure Node — no browser, no image library — so it costs about a second.
      # Generating the icons needs Chromium; checking them does not, which is
      # what lets the check run here at all.
      - name: Verify PWA icons match their declared purpose
        run: npm run icons:verify

      # Checks that every origin the page may load a subresource from is also
      # in `connect-src`. Not redundancy: the Angular service worker re-fetches
      # every request from inside the worker, where `connect-src` is the
      # directive that applies rather than `script-src`/`frame-src`. An origin
      # missing from it loads fine until the service worker takes control and
      # then fails as a synthetic 504, with the CSP refusal logged in the
      # worker's console rather than the page's. That is how Google sign-in
      # broke, and nothing else in the pipeline can see it — Lighthouse loads
      # the page once, uncontrolled, and OAuth is not in the e2e suite.
      - name: Verify the CSP covers the service worker's re-fetches
        run: npm run csp:verify

      # Fails on an `animate-*` utility that is not gated on
      # `prefers-reduced-motion`. This is invisible to everyone who does not
      # have the OS setting switched on — it looks perfect to the author, the
      # reviewer, Lighthouse and the e2e suite — which is exactly why it is a
      # check and not a convention. The first animation in this app shipped
      # ungated and nothing noticed. Scope and reasoning: `scripts/verify-motion.mjs`.
      - name: Verify animations respect prefers-reduced-motion
        run: npm run motion:verify

      # Fails when anything non-production can reach the production Firebase
      # project. Here rather than in a workflow of its own for the reason
      # given at the top of this file: `lint` is required today, so a step
      # added here gates a merge immediately.
      #
      # The defect it guards against was invisible to every other check, and
      # invisible in the worst way — `npm start` worked. It worked against the
      # real database, because the `development` build had no
      # `fileReplacements` and quietly inherited `environment.ts`. Nothing was
      # red for as long as that was true. Reasoning:
      # `scripts/verify-environment-isolation.mjs`.
      - name: Verify no non-production build can reach production
        run: npm run env:verify
