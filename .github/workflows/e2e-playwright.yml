name: E2E Tests (Playwright)

# The Playwright end-to-end suite, against a real (local, ephemeral) Firebase
# Emulator Suite instance — the same shape as e2e.yml, which runs the Cypress
# suite next to it.
#
# Two suites run on every PR while the migration is under way, and that is the
# point rather than an oversight: the Cypress job is what the `main` ruleset
# requires, so it keeps gating merges until every spec has been ported and the
# jobs swap names. Nothing is uncovered in the meantime, and a ported spec that
# disagrees with its original is caught by the two disagreeing.
#
# This job is deliberately *not* named `e2e`: that context is the required one,
# and taking it over before the port is finished would drop the coverage this
# arrangement exists to keep. See docs/ci-cd.md §4.3.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e-playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      # Keyed on the lockfile, because the lockfile is what decides which
      # Chromium build `playwright install` fetches: the browser revision is a
      # property of the pinned `@playwright/test` version, not something chosen
      # here. A bumped version therefore misses the cache and downloads the
      # browser that version expects, which is the behaviour that keeps the
      # runner and a developer's machine on the same build.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      # `--with-deps` installs the system libraries headless Chromium needs.
      # It is a no-op for the browser itself when the cache hit above already
      # provided it.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        run: npm run pw:e2e

      # The trace of a failed test is the thing worth having here: it replays
      # the run frame by frame with the DOM at every step, which is what makes
      # a CI-only failure diagnosable without reproducing it.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
