name: Deploy to Firebase Hosting

# Fires only when a PR targeting main is closed AND merged (not just closed/declined).
#
# This intentionally does not re-run e2e itself: gating is structural via
# GitHub branch protection on main, which requires the `E2E (preview)` job
# from firebase-preview.yml to pass before a PR can be merged at all — so by
# the time this workflow fires, that check has already passed against a real
# deployed preview build of this exact code.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build:prod

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELLECTURA_3B26A }}'
          projectId: intellectura-3b26a
          channelId: live

      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELLECTURA_3B26A }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project intellectura-3b26a

      - name: Clean up service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"
