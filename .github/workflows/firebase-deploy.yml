name: Deploy to Firebase Hosting

# Fires only when a PR targeting main is closed AND merged (not just closed/declined).
#
# This intentionally re-runs no tests of its own: gating is structural. A
# repository ruleset on `main` (enforcement: active) requires all five CI
# checks — `test`, `e2e`, `lighthouse`, `Deploy preview channel` and
# `E2E (preview)` — to pass before a PR can merge, with
# strict_required_status_checks_policy on so the branch must also be up to
# date first. By the time this workflow fires, every one of those has already
# passed against this exact code, including a real deployed preview build.
#
# Note it is a *ruleset*, not classic branch protection: the legacy
# /branches/main/protection API returns 404 "Branch not protected" regardless.
# Check /rules/branches/main instead before concluding gating is missing.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build:prod

      # Backend first, client last (finding D2). Hosting used to go first,
      # which put a new client live against an old backend for the length of
      # the remaining steps — a window that only ever bites on the release
      # where it matters, because that is the release that changed both.
      #
      # The reverse exposure (an old client against a new backend) is not
      # avoidable by ordering at all: a visitor with the app open across a
      # deploy, or one served the precached shell by the service worker, is
      # running an old client whichever order these steps take. So a backend
      # change has to stay compatible with the deployed client *regardless* —
      # and once that is true, backend-first strictly dominates, because it is
      # the only order that also closes the new-client window.
      # The secret reaches the shell through `env`, never `${{ }}` inside
      # `run:` — template expansion pastes the value into the script text
      # itself, where its characters are parsed as shell (A11). Same idiom
      # as firebase-preview.yml's cleanup job, which always had it right.
      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELLECTURA_3B26A }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project intellectura-3b26a

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      # Kept as its own step (not batched with the Firestore rules/indexes
      # deploy above) so a functions-only failure is easy to spot separately
      # from the Hosting/Firestore rules deploys above.
      - name: Deploy Cloud Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELLECTURA_3B26A }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          # @14, not @13 like the Firestore rules/indexes step above: @13's
          # bundled Functions support predates firebase-functions v7's
          # removal of `functions.config()` and unconditionally probes for
          # it, crashing — confirmed locally against the emulator; @14
          # detects v7+ and skips that legacy path.
          npx firebase-tools@14 deploy --only functions --project intellectura-3b26a

      # Immediately after its last user rather than at the end of the job: the
      # Hosting step below authenticates from the secret directly and never
      # reads this file, so keeping it on disk any longer buys nothing.
      - name: Clean up service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"

      # Last, so the client only goes live once the rules, indexes and
      # functions it depends on are already there.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELLECTURA_3B26A }}'
          projectId: intellectura-3b26a
          channelId: live

      # Asks the deployed site whether it actually works, rather than trusting
      # that a green deploy step means a working production (finding D3). The
      # checks live in a script so they can be run against production from a
      # laptop — workflow steps can only be tested by merging them.
      #
      # This runs last and cannot undo anything: by the time it fails, the
      # deploy has shipped. Failing is still the point — it is what turns a
      # broken production into something someone is told about, and
      # INFRASTRUCTURE.md §6.3a is the rollback it points at.
      - name: Smoke-test production
        run: node scripts/smoke-test.mjs https://trivimind.com

  # `trivimind-dev` gets the same commit, automatically, for the same reason it
  # exists at all: it is only a faithful mirror while it is *current*. Nothing
  # deployed its live channel before this — `firebase-preview.yml` creates a
  # per-PR channel on the same project, and `npm run firebase:deploy:dev` is a
  # laptop command somebody has to remember — so `trivimind-dev.web.app` served
  # whatever was last pushed by hand, indefinitely.
  #
  # That is not a tidiness problem, and it cost a full round trip to diagnose.
  # PR #153 fixed a CSP that refused Google sign-in on dev; the preview channel
  # for the next PR picked the fix up immediately (it is built from that PR's
  # head) while `trivimind-dev.web.app` went on refusing sign-in, because no
  # deploy had touched it. Every client-side remedy — clearing storage,
  # unregistering the service worker, hard reloads — was doomed by
  # construction: the stale artifact was the *response header*, on the server.
  #
  # **The rules are the sharper edge.** `E2E (preview)` runs against this
  # project's real Firestore, so a `firestore.rules` change that merged without
  # reaching dev leaves the preview suite validating against the previous
  # rules — green, and about the wrong thing. That is the failure mode
  # `dev-environment.md` calls "dev less trustworthy than no dev at all".
  #
  # Independent of the production job on purpose: dev is not downstream of
  # production, and holding one deploy behind the other only widens the window
  # in which they disagree. The commit is the same one the preview channel
  # already exercised end to end.
  deploy-dev:
    name: Deploy to trivimind-dev
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # The same three as the production job, and `contents: read` alone is not
    # enough — which this job proved by failing on it. `action-hosting-deploy`
    # opens a check run named "Deploy Preview" whichever channel it targets, so
    # without `checks: write` it dies with GitHub's own
    # `403 Resource not accessible by integration` *after* the Firebase deploy
    # would have run. `ci-cd.md` §4.2 already recorded this exact 403 against
    # the production job; narrowing the new job's permissions repeated it.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build:dev-project`, not `build:prod`: the only difference is
      # `environmentLabel: 'DEV'`, and that badge is the sole thing on screen
      # distinguishing a faithful copy from the original — which matters most
      # in exactly the moment someone tries a destructive change believing they
      # are on dev. (`firebase-preview.yml` builds `build:prod` for its
      # channels and that is a separate question; a preview URL already says
      # what it is.)
      - name: Build dev-project app
        run: npm run build:dev-project

      # Backend first, client last, same as production above (finding D2).
      # The secret reaches the shell through `env`, never `${{ }}` inside
      # `run:` — template expansion pastes the value into the script text
      # itself, where its characters are parsed as shell (A11).
      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIVIMIND_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project trivimind-dev

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      # Its own step, same as production: a functions-only failure should be
      # distinguishable at a glance from a rules or Hosting one. `@14` rather
      # than the `@13` used for rules/indexes above — `@13`'s bundled Functions
      # support predates firebase-functions v7's removal of `functions.config()`
      # and unconditionally probes for it, crashing.
      - name: Deploy Cloud Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIVIMIND_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@14 deploy --only functions --project trivimind-dev

      # After its last user, not at the end of the job: the Hosting step below
      # authenticates from the secret directly and never reads this file.
      - name: Clean up service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIVIMIND_DEV }}'
          projectId: trivimind-dev
          channelId: live

  # **What the first run of `deploy-dev` taught, kept because the shape recurs.**
  #
  # It failed on the *rules* step: `403, The caller does not have permission`
  # from `firebaserules.googleapis.com`. The credential had been deploying
  # preview channels to this same project on every PR for weeks, which read as
  # proof that it worked — and proved only that it could deploy **Hosting**.
  # A Firebase service account generated from Project settings carries the
  # Admin SDK service agent role and nothing else; Hosting, Firestore rules,
  # Firestore indexes and Cloud Functions are four separate grants.
  #
  # So "the credential is already in use" is not evidence it is sufficient for
  # a *new* use of it. The roles this job needs are listed in
  # `docs/dev-environment.md` §3.3, next to the step that issues the key,
  # rather than left to be rediscovered from a 403.
  #
  # Note also which way the failure fell: backend-first ordering meant the
  # rules failure stopped the job before Hosting ran, so dev stayed on its old
  # bundle. That is the correct trade — a half-deployed mirror is worse than an
  # un-deployed one — but it does mean a rules-permission problem presents as
  # "the site did not update", which points at Hosting.

  # The deploy failing used to be silent: it went red four merges running while
  # Hosting kept shipping, and nothing surfaced it. An issue is the cheapest
  # durable signal that does not depend on anyone watching a run or reading a
  # notification email — and unlike a comment on the merged PR, it stays open
  # until someone closes it.
  report-failure:
    needs: [deploy, deploy-dev]
    if: failure() && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue for the failed deploy
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pr = context.payload.pull_request;
            const title = `Deploy failed after merging #${pr.number}`;
            const body = [
              `The merge-to-deploy pipeline failed for **#${pr.number} — ${pr.title}**.`,
              '',
              `- Failed run: ${runUrl}`,
              `- Merge commit: ${pr.merge_commit_sha}`,
              '',
              'Two jobs run here — `deploy` (production, `intellectura-3b26a`) and `deploy-dev`',
              '(`trivimind-dev`) — and they are independent, so **check which one failed**: a red',
              'run does not mean production is affected.',
              '',
              'Within a job the order is Firestore rules/indexes, then Cloud Functions, then',
              'Hosting — backend first, client last (finding D2). So a failure part-way leaves an',
              '**older client against a newer backend**, never the reverse. Check which step',
              'failed before assuming nothing shipped.',
              '',
              'Rollback and recovery: `INFRASTRUCTURE.md` §6.3a.',
            ].join('\n');

            // One open issue at a time — a broken pipeline fails on every
            // subsequent merge, and twenty identical issues is a worse signal
            // than one.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deploy-failure'],
            });
