name: Deploy Preview Channel

# Every PR targeting main gets its own ephemeral Firebase Hosting preview
# channel (pr-<number>), so changes can be reviewed on a live URL — and
# smoke-tested end-to-end against a real Firebase project — before merge,
# instead of only finding out after they've already gone to production (see
# firebase-deploy.yml, which is merge-to-deploy only).
#
# **That project is `trivimind-dev`, and until FEAT-012 it was production.**
# Not read-only, either: the e2e job here creates real Auth users, real
# `custom_questions` documents and real `leaderboards/{limit}/entries` rows,
# swept afterwards — on every PR, from any contributor whose PR a maintainer
# approved for workflow runs. It was the single largest production exposure in
# the repo, and it was invisible because the sweep mostly worked, which is why
# that sweep now fails the job rather than reporting nothing when it cannot
# delete something.
#
# `trivimind-dev` runs the same production build against the same rules, the
# same indexes and the same `firebase.json` headers, so what the preview
# validates is unchanged; what changed is whose data it writes to.
# `npm run env:verify` fails if this file names the production project again.
#
# The deploy job also ships the PR's **Firestore indexes** to that project
# before the channel goes up, which is the one piece of backend configuration a
# preview can validate: the emulator enforces none of it, so an index mistake is
# otherwise green until it is merged (see the step for the full reasoning).
#
# The `E2E (preview)` job is meant to be a required status check on `main`
# (branch protection), so a PR can't be merged — and therefore can't trigger
# firebase-deploy.yml — unless the real preview build actually passed e2e.
# `closed` is here for the cleanup job at the bottom, not for deploying. A
# preview channel is created per PR but nothing used to delete one, and the 7-day
# TTL expires them more slowly than this repo merges PRs — so they accumulated to
# Firebase's 50-channel-per-site cap, at which point *every* new PR failed to
# deploy with `429 channel quota reached`. Deleting the channel when its PR
# closes keeps the count proportional to open PRs rather than to time.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy preview channel
    # Not for Dependabot. This job runs `npm ci` and `npm run build:prod` —
    # executing the install scripts and build-time code of the very dependency
    # version under review — and only then hands a Firebase *deploy* service
    # account to the deploy step. Granting Dependabot that credential would put
    # untrusted package code in a job that holds it, which is the exact shape of
    # a supply-chain attack, on a PR whose entire purpose is changing a
    # dependency.
    #
    # Skipping is safe for merge gating: this is a required check, and a job
    # skipped by a *job-level* `if` reports a "skipped" conclusion, which branch
    # protection treats as success. (A job that never appears at all would block
    # forever instead — so the condition has to live here, not on the steps.)
    #
    # The checks that would actually catch a bad bump — test, e2e, lint,
    # rules-tests, lighthouse — all still run, because none of them needs a
    # credential.
    # The `closed` half of the condition exists because this workflow also
    # handles cleanup (see `on:` above) — there is nothing to deploy to a PR
    # that has just been closed or merged.
    if: github.actor != 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      preview_url: ${{ steps.preview_url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build:prod

      # Indexes, and only indexes, before the channel goes up.
      #
      # A preview channel is Hosting-only, so a PR's Firestore *configuration*
      # never reached `trivimind-dev` until it merged — which meant a PR adding
      # a query shape deployed a client that could not run it, and the emulator
      # could not have told anyone, because it enforces no index configuration
      # at all (`AUDIT_REMEDIATION.md` D3). That is the failure mode that took
      # the production deploy pipeline down across four merges: an index
      # mistake is green everywhere until it is deployed.
      #
      # **Indexes and not rules.** Adding an index is additive and affects no
      # existing query, so a PR that declares a bad one fails its own check
      # rather than anybody else's. Rules are a security boundary that every
      # client of the shared dev project is already running against, and
      # deploying an unmerged PR's version of them from a preview job is a
      # different and much larger decision — `firebase-deploy.yml` keeps it.
      #
      # An index **build** is asynchronous: this step returns once the creation
      # is accepted, and a query needing a brand-new index can still be refused
      # for the seconds or minutes it takes to build. The e2e job's own
      # checkout, install and browser download sit in between, which is the
      # slack that makes this workable — but a spec introducing an index in the
      # same PR should stay out of the preview slice for that one release
      # (`playwright.preview.config.ts` says which, and why).
      - name: Deploy Firestore indexes to the dev project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIVIMIND_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-index-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13 deploy --only firestore:indexes --project trivimind-dev
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Clean up index-deploy credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-index-account.json"

      - name: Deploy preview channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIVIMIND_DEV }}'
          projectId: trivimind-dev
          channelId: 'pr-${{ github.event.pull_request.number }}'
          expires: 7d

      - name: Extract preview URL
        id: preview_url
        run: |
          url=$(echo '${{ steps.deploy.outputs.urls }}' | jq -r '.[0]')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "Could not extract a preview URL from the deploy action's 'urls' output: '${{ steps.deploy.outputs.urls }}'" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  e2e-preview:
    # NOTE: this `name` is the status-check context (`E2E (preview)`), and it is
    # required by main's ruleset. Don't change it — a required context is stored
    # by name, so renaming silently detaches the requirement and lets PRs merge
    # without the preview suite having run.
    name: E2E (preview)
    needs: deploy-preview
    # A scoped slice of the suite (docs/ci-cd.md §4.3) against the channel
    # `deploy-preview` has just published, and therefore against the real
    # `trivimind-dev` project — which is what makes it worth running next to the
    # emulator suite in e2e.yml: real headers, a real service worker, real rules
    # and real Cloud Functions. One runner, no shard; the slice is 79 tests and
    # takes under two minutes.
    #
    # Stated rather than inherited from `deploy-preview`'s own guard: this job
    # reads the service account too (the sweep deletes the accounts and
    # documents the run created), so the Dependabot guard should not depend on a
    # `needs` cascade that an `if: always()` would quietly remove.
    if: github.actor != 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Keyed on the lockfile, because the lockfile is what decides which
      # Chromium build `playwright install` fetches: the browser revision is a
      # property of the pinned `@playwright/test` version, not something chosen
      # here. A bumped version therefore misses the cache and downloads the
      # browser that version expects.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # `--with-deps` installs the system libraries headless Chromium needs. It
      # is a no-op for the browser itself when the cache hit above already
      # provided it.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # No emulators and no dev server: the app under test is the channel that
      # was just deployed, fetching its own Firebase config from that channel's
      # `/__/firebase/init.json` exactly as a real visitor does. The credential
      # below is for the Node side only — `e2e/fixtures/firebase-preview-target.ts`,
      # which seeds what the specs need and sweeps it all up afterwards.
      # `env`, not `${{ }}` inside `run:` — see firebase-deploy.yml (A11).
      - name: Run the preview slice against the deployed channel (unauthenticated + limited authenticated flows)
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIVIMIND_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          # Read by `e2e/fixtures/firebase-preview-target.ts`, which refuses to
          # start without it rather than defaulting to anything. There is no
          # value it could safely default *to*: the only obvious one is the
          # project it used to be hard-coded to.
          FIREBASE_PREVIEW_PROJECT_ID: trivimind-dev
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm run e2e:preview

      - name: Clean up service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"

      # The trace of a failed test replays the run frame by frame with the DOM
      # at every step, which is what makes a failure that only happens against a
      # real deployment diagnosable without reproducing it.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  cleanup-preview:
    name: Delete preview channel
    # Runs only on close (merged or not) — the counterpart to `deploy-preview`.
    # Dependabot never gets a channel deployed (see that job's comment), so
    # there is never one of its own to delete.
    if: github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `hosting:channel:delete` refuses to run outside a Firebase app
      # directory ("could not locate firebase.json") — it resolves the target
      # site from that file, and `--site`/`--project` do not substitute for it.
      # Without this the job fails on every merge, which is how it shipped:
      # nothing else in this job needs the repo, so its absence wasn't obvious.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete this PR's preview channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIVIMIND_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          CHANNEL: pr-${{ github.event.pull_request.number }}
        # A missing channel is a success, not a failure: the deploy may have been
        # skipped or may itself have failed (which is exactly what happened while
        # the quota was full). Anything else is a real error and fails the job —
        # deliberately not `continue-on-error`, which would also swallow a
        # credential or permission problem and let the channels silently pile up
        # again, which is the very failure this job exists to prevent.
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          if npx --yes firebase-tools@14 hosting:channel:delete "$CHANNEL" \
              --project trivimind-dev --force 2>&1 | tee /tmp/channel-delete.log; then
            echo "Deleted preview channel $CHANNEL."
          elif grep -qiE 'not found|does not exist' /tmp/channel-delete.log; then
            echo "No preview channel $CHANNEL to delete — nothing to do."
          else
            echo "Failed to delete preview channel $CHANNEL." >&2
            exit 1
          fi

      - name: Clean up service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"
